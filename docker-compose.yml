services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: animalpictures
      POSTGRES_USER: animal
      POSTGRES_PASSWORD: animal
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U animal -d animalpictures"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/animalpictures
      SPRING_DATASOURCE_USERNAME: animal
      SPRING_DATASOURCE_PASSWORD: animal
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data: